name: Update X feed

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-x-feed
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Generate feed
        run: node generate-feed.mjs
      - name: Commit new posts
        run: |
          if git diff --quiet -- docs/feed.xml; then
            echo "No new posts."
            exit 0
          fi
          git config user.name "haddonfield-feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/feed.xml
          git commit -m "Update X feed"
          git push
